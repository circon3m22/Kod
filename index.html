<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f6">
<meta name="description" content="Автономная платформа исторического квиза Культурный код">
<title>Культурный код · Исторический квиз</title>
<style>#loading-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#f7f7f4;color:#1c1c1a;font:500 17px/1.3 Arial,sans-serif;transition:opacity .35s ease}#loading-screen.loaded{opacity:0;pointer-events:none}.loading-content{width:min(320px,75vw);text-align:center}.loading-title{font-size:20px;letter-spacing:.16em}.loading-track{height:2px;margin:28px 0 13px;background:#deded9}.loading-track>span{display:block;height:100%;width:0;background:#20211f;transition:width .18s linear}.loading-progress{color:#777;font-size:14px}.loading-retry{margin-top:22px;border:0;border-bottom:1px solid #222;background:transparent;font:inherit;cursor:pointer}</style>
<link rel="preload" href="assets/fonts/Onest-Variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css?v=20261031-teams-preload">
<link rel="stylesheet" href="flow.css?v=20261031-teams-preload">
<script src="quiz-data.js?v=20261031-teams-preload" defer></script>
<script src="cover-art.js?v=20261031-teams-preload" defer></script>
<script src="cover-film.js?v=20261031-teams-preload" defer></script>
<script src="quiz-flow.js?v=20261031-teams-preload" defer></script>
<script src="preload-assets.js?v=20261031-teams-preload" defer></script>
<script src="app.js?v=20261031-teams-preload" defer></script>
<script src="preload.js?v=20261031-teams-preload" defer></script>
</head>
<body>
<div id="loading-screen" role="status" aria-live="polite"><div class="loading-content"><div class="loading-title">КУЛЬТУРНЫЙ КОД</div><div class="loading-track" aria-hidden="true"><span id="loading-line"></span></div><div class="loading-progress" id="loading-progress">0%</div><button class="loading-retry" id="loading-retry" type="button" hidden>Повторить</button></div></div>
<div id="safe-probe" aria-hidden="true"></div>
<div id="viewport" inert><div id="stage">
<header id="header"></header>
<main id="screen"></main>
<footer id="scorebar"></footer>
<div id="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
</div></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<input type="file" id="video-file" accept="video/*" hidden>
<noscript>Для запуска квиза включите JavaScript в браузере.</noscript>
</body>
</html>
