<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка размеров сцены</title><style>body{margin:0;background:#303731;color:#fff;font:16px Arial;overflow:hidden}nav{height:60px;display:flex;gap:8px;align-items:center;padding:0 20px}button{font:inherit;padding:9px 14px;cursor:pointer}#wrap{position:absolute;left:20px;top:75px;transform-origin:top left}iframe{border:0;display:block}#report{position:absolute;bottom:8px;left:20px;font:14px monospace}</style><nav>Размер окна квиза: <button data-size="1920,1080">1920 × 1080</button><button data-size="1366,768">1366 × 768</button><button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button><button data-size="844,390">844 × 390</button><button data-size="932,430">932 × 430</button></nav><div id="wrap"><iframe id="app" title="Квиз на проверяемом экране" src="../index.html"></iframe></div><output id="report"></output><script>
let width=1366,height=768;const f=document.querySelector('iframe'),wrap=document.getElementById('wrap');
function resize(){f.style.width=width+'px';f.style.height=height+'px';wrap.style.transform='scale('+Math.min((innerWidth-40)/width,(innerHeight-130)/height,1)+')';}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{[width,height]=b.dataset.size.split(',').map(Number);resize();});window.onresize=resize;
setInterval(()=>{try{const d=f.contentDocument,s=d.getElementById('stage'),r=s.getBoundingClientRect();document.getElementById('report').textContent=JSON.stringify({viewport:[f.contentWindow.innerWidth,f.contentWindow.innerHeight],rotation:s.dataset.rotation,scale:s.dataset.scale,scene:[Math.round(r.width),Math.round(r.height)],sceneScroll:[s.scrollLeft,s.scrollTop],pageScroll:[d.documentElement.scrollWidth,d.documentElement.scrollHeight]});}catch(e){}},300);resize();
</script></html>
